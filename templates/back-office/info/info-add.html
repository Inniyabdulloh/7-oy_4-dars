{% extends 'base.html' %}

{% block content %}
    <br><br>
<form class="m-5" method="post" action="{% url 'info-create' %}" enctype="multipart/form-data">
{% csrf_token %}
  <div class="mb-3">
      <label for="product">Phone</label>
      <input name="phone" type="text" value="{{ info.phone }}">
  </div>
    <div class="mb-3">
      <label for="product">Address</label>
        <textarea name="address" type="text" >{{ info.address }}</textarea>
  </div>
  <div class="mb-3">
    <div class="form-check form-switch">
      <input name="active" class="form-check-input" type="checkbox" role="switch" id="flexSwitchCheckDefault">
      <label class="form-check-label" for="flexSwitchCheckDefault">Active ?</label>
    </div>
  </div>

<div class="mb-3">
      <label for="product">Facebook</label>
        <input name="facebook" type="text" >
  </div>
<div class="mb-3">
      <label for="product">Twitter</label>
        <input name="twitter" type="text" >
  </div>
<div class="mb-3">
      <label for="product">linkedin</label>
        <input name="linkedin" type="text">
  </div>

  <div class="mb-3">
       <label for="img">Images</label>
      <input id="img" multiple type="file" name="photos">
      </div>
   

  <button type="submit" class="btn btn-primary">Save</button>
</form>

{% endblock %}
