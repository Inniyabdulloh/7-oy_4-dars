{% extends 'base.html' %}
{% block content %}

    <br><br>
    
<table class="table table-info m-5 me-1">
  <thead>
    <tr>
      
      <th scope="col">Phone</th>
      <th scope="col">Address</th>
      <th scope="col">Is active</th>
      <th scope="col">Image</th>
      <th scope="col">Update</th>
      <th scope="col">Delete</th>  
    </tr>
  </thead>
  <tbody>
  
    <tr>
      
      <td>{{ info.phone }}</td>
      <td>{{ info.address }}</td>
      <td>
          <div class="btn-group" role="group" aria-label="Basic mixed styles example">
              {% if not info.is_active %}
          <button type="button" class="btn btn-danger">No Avtive</button>
              {% else %}
          <button type="button" class="btn btn-success">Active</button>
              {% endif %}
          </div>
      </td>
        <td>
            <img height="75" width="75" src="{{ info.photo.url }}" alt=""></td>
        <td>
            <a href="{% url 'info-update' info.generate_code %}">Update</a>
        </td>
        <td>
            <a href="{% url 'info-delete' info.generate_code %}">Delete</a>
        </td>
        
    </tr>

  </tbody>
</table>


{% endblock %}
